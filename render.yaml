services:
  - type: web
    name: filesharex-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1.0/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: filesharex-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://filesharex-backend.onrender.com/api/v1.0
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_RAZORPAY_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
