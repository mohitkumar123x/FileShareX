spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_URL:${MONGO_URI:mongodb://localhost:27017/FileShareX}}}
server.port=${PORT:8080}

server.servlet.context-path=/api/v1.0

#spring.data.mongodb.auto-index-creation=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

clerk.issuer=${CLERK_ISSUER:ADD_YOUR_ISSUER}
clerk.jwks-url=${CLERK_JWKS_URL:ADD_YOUR_JWKS_URL}
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET:ADD_YOUR_WEBHOOK_SECRET}

#file upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

#razorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID:ADD_YOUR_RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:ADD_YOUR_RAZORPAY_SECRET}